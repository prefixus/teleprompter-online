<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#grad-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Teleprompter hood / glass trapezoid -->
  <path d="M 120 130 L 392 130 L 442 340 L 70 340 Z" fill="url(#grad-glass)" opacity="0.18" />
  <path d="M 120 130 L 392 130 L 442 340 L 70 340 Z" fill="none" stroke="url(#grad-glass)" stroke-width="6" stroke-linejoin="round" />

  <!-- Reflection 45-degree angle indicator line -->
  <line x1="80" y1="330" x2="432" y2="140" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 8" opacity="0.7"/>

  <!-- Teleprompter Screen Base -->
  <rect x="100" y="360" width="312" height="24" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="220" y="384" width="72" height="24" fill="#334155" />
  <rect x="170" y="408" width="172" height="16" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Flowing Text Lines in the screen -->
  <rect x="150" y="180" width="212" height="14" rx="7" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <rect x="130" y="220" width="252" height="14" rx="7" fill="url(#grad-accent)" filter="url(#glow)"/>
  <rect x="160" y="260" width="192" height="14" rx="7" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <rect x="180" y="300" width="152" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>

  <!-- Mirror indicator arrows -->
  <path d="M 390 220 L 420 220 M 420 220 L 405 205 M 420 220 L 405 235" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 122 220 L 92 220 M 92 220 L 107 205 M 92 220 L 107 235" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
